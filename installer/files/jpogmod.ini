; ============================================================
;  JPOG Co-op v2 - settings  (installed into the game folder as jpogmod.ini)
;  Edit values here; no rebuild needed. Lines starting with ; are comments.
; ============================================================

[general]
; Master switch.
enabled = 1
; Write a log to the game folder (jpogmod.log) - keep on while building/testing.
log = 1

[controller]
; Native Xbox controller. 1 = on. Works plug-and-play (XInput).
enabled = 1
; Controls style. 1 = CONSOLE (like the Xbox version): left stick / D-pad move the camera and the
;   highlight in the build ring and menus, A = select/place at the middle of your view, B = back.
; 0 = PC style: left stick moves a mouse cursor, RT = click. Right-stick click switches at any time.
console_mode = 1
; JPOG39: marks that the console scheme was made the default (the mod sets this itself; do not change).
scheme_version = 39
; JPOG39: ground circle (like the demolish tool's) under your aiming point in console style. 1 = on.
aim_circle = 1
; size of the circle (the demolish tool uses 4), 1..12
aim_circle_size = 4.0
; split-screen: also a bigger orange circle on the dinosaur the player without the HUD would take with A
aim_pick_circle = 1
; Rumble.
vibration = 1
; Stick deadzone (0..1) and trigger threshold (0..1).
deadzone = 0.24
trigger_threshold = 0.12
; Look sensitivity (right stick) and in-menu cursor speed.
look_sensitivity = 1.0
cursor_speed = 1.0
; JPOG35: hold RT + left stick in the park view = pan the camera directly (speed). RT tap still does its job on release.
rt_pan_speed = 1.5

; --- MENU / MANAGER-MODE mapping = the Xbox-version scheme (docs\assets\xbox_controller_scheme_reference.jpg),
;     sent as the game's own keyboard keys from Options.ini [Controls]. Values: key names
;     (A-Z, 0-9, F1-F12, ENTER, ESCAPE, SPACE, TAB) or MOUSE_L / MOUSE_R.
; JPOG59: the vanilla info bar (Info / Summary / Orders) from the pad: D-pad = highlight a button, A = press it.
info_bar_pad = 1
window_spinners = 1    ; JPOG62: in any window the D-pad / stick left-right turns pickers (hatchery Category / Species / Release mode) and sliders, lists scroll; 0 = highlight only
; JPOG59: no controller connected = PC style (free mouse, no centre lock, no aim circle). 0 = old behaviour.
pc_without_pad = 1
main_menu_both_pads = 1   ; JPOG68: outside a park (main menu, load, options, Quit) either controller works the menus
[map.manager]
A        = ENTER         ; Confirm
B        = ESCAPE        ; Cancel / back
X        = B             ; Build menu        (Options.ini Build=B)
Y        = E             ; Rotate building   (RotateRight=E)
LB       = F3            ; Fossil Hunt       (GotoFslHunt=F3)
RB       = F4            ; Genetics Lab      (GotoDNALab=F4)
BACK_TAP = F2            ; Research          (GotoResearch=F2)
RS       = M             ; Messages          (Mail=M)
START    = ESCAPE        ; Main menu
RT       = MOUSE_L       ; Select / left click
LT       = MOUSE_R       ; Context / right click
DPAD     = ARROWS        ; Move camera / menu nav
LSTICK   = MOUSE_MOVE    ; Move cursor
RSTICK   = CAMERA        ; Rotate (Q/E) + zoom (R/F)

[player]
; 1 = hold Back 0.6 s = Ranger on-foot mode (EXPERIMENTAL, not part of Co-op v1).
ranger_hold_back = 0
; On-foot tuning (used once player mode is built).
walk_speed = 4.0
run_mult   = 1.8
turn_rate  = 180.0
camera_distance = 4.5
aim_fov_scale = 0.6
; Default view: ots | scope | firstperson
view_mode = ots
; Avatar skin unit (ranger). Must be a valid Units/*.ini name.
avatar_unit = ranger
; Default weapon: tranq | lethal
weapon = tranq
; 1 = the vanilla 'shoot from vehicle' cheat is always on (safari jeep). 0 = leave it to the cheat code.
vehicle_shoot = 1

[hud]
; 1 = short on-screen hints (control style, dino control) through the game's own hint line.
hints = 1
; JPOG66: our own widescreen support (no third-party plugin needed). Switches itself OFF while JPOGMouseFix.asi
; (another widescreen plugin) is in the game folder, so the two never fight.
widescreen = 1
; Wide screens show more at the sides instead of cutting off the top and bottom.
hor_plus = 1
; Menus and HUD drawn unstretched (one scale, centred); in split-screen inside the HUD player's half.
gui_fix = 1
; GUI size: one player / split-screen (1.0 = fit the screen / the half, up to 2.0; panels stay on the edges).
scale = 1.0
split_scale = 1.3
; JPOG67: HUD panels and the disc menus sit on the real edges of the screen (split-screen: of the player's half).
pin_edges = 1

[dino]
; Dino control: aim at a dino + A (select), then RB + D-pad Up = control it. LS move, RS camera, RT bite, B let go.
enabled = 1
; Steering target this far ahead of the dino (m); speed multiplier at full stick.
lead_distance = 14
run_mult = 1.6
; RT bite (hold RT = keep biting): hurts the nearest dino within attack_range (m); damage = max(min, target health * frac);
; attack_cooldown = seconds between bites.
attack_range = 10
attack_damage_min = 8
attack_damage_frac = 0.2
attack_cooldown = 0.8
; 1 = invert the left stick axis while controlling a dino.
invert_x = 0
invert_y = 0
; Split-screen dino camera (each dino player gets their own chase camera; the other player keeps building).
; Right stick = orbit, D-pad Up/Down = zoom. Distance (m), aim height above the dino (m), start angle (deg), turn speed.
cam_distance = 13
cam_look_height = 2.5
cam_pitch = 22
cam_turn_rate = 120
cam_invert_x = 0
cam_invert_y = 0
; Dino action buttons while you control a dino: Y roar, X eat (X again or move = stop),
; LB = lie down and sleep (LB again or move = get up), RT on a dinosaur with less health than finish_health_low =
; finishing move (the dinos' own paired kill animations, e.g. T-rex vs Triceratops; Raptor = pounce + grapple),
; otherwise a bite. JPOG37: X again while eating = swallow; big carnivores (T-rex, Spino, Allo...) RT next to a goat /
; cow (within grab_range m) = grab it and swallow it. actions = 0 turns them off.
actions = 1
; (finish_health = old JPOG32-36 key, no longer used)
finish_health = 250
; JPOG37: finishing move / raptor grapple only on a victim with less health than this.
finish_health_low = 60
grab_range = 7
; JPOG36: 1 = the controlled dino's own behaviour script is paused while you control it (it no longer walks off,
; cuts eating short or plays its own anims over yours).
freeze_behaviour = 1
; JPOG36: 1 = the controlled dino always gets the full-rate update, also when the builder's camera can't see it
; (no stutter / shaking while walking in split-screen).
force_visible = 1
; JPOG59: stick straight sideways = strafe, pulled down = walk backwards (T-Rex / Spino have a back-walk anim), never runs.
strafe_back = 1
back_all = 1          ; JPOG60: stick down walks backwards (facing forward) for EVERY dinosaur - walk_bck_lp if it has one, else walk_lp. 0 = old turn-round for species without walk_bck_lp
ride_hud = 0           ; JPOG62 (off in JPOG63 - flickered): 1 = while the player with the menus rides a dino, the HUD shows only the dino stats + the minimap
a_takes_control = 0    ; JPOG63 : 0 = old way - A only selects a dino, RB + D-pad Up takes control. 1 = A takes control at once
select_hint = 1        ; JPOG63: selecting a dino shows "press RB + D-pad Up to control it" (console or PC-style wording)
ride_hud_mask = 0x1100 ; JPOG62: HUD parts while riding (0x100 dino stats, 0x1000 minimap, 0x800 highlight rings, 0x4000/0x8000 toolbar discs; vanilla = 0x59F4B)
strafe_speed = 2.0
back_speed = 1.6
; JPOG59: A = drink, only next to water.
drink = 1
select_radius = 12     ; JPOG68: A selects the nearest dino within this many metres of the aim when the game's own pick missed
; JPOG65: finishing moves line up like the vanilla game (Units.dll SetFatalityAnims distances: T-rex/Spino 14.4 m,
; Tricera/Steg 11.65 m, Anky 11.5 m centre to centre, facing each other, both anims start together).
; 1 = vanilla "perfect" distance, 2 = vanilla walk-in window (a bit closer), 0 = off (old JPOG64 behaviour).
finisher_align = 1
; Metres added to that distance if a pair still looks off (e.g. -0.5 or 0.5).
finisher_dist_add = 0.0
; Vanilla SetInterpolation + no avoidance steering while the kill plays (0 = off if it misbehaves).
finisher_interp = 1
; Raptor pounce: latches only at this gap (m, edge to edge; vanilla latches at <= 3.5).
pounce_gap = 3.0
; JPOG69 R6: side/back steps by the dino's own facing (1); 0 = JPOG61-68
step_by_facing = 1
; JPOG69 R6 test switch: 1 = side-steps go the other way
step_invert_x = 0
; JPOG69 R2: RB held = turn right, RB tap = finishing move; 0 = RB press = finishing move
rb_turn = 1
; JPOG69 R2: RB released sooner than this (s) = tap
rb_tap_time = 0.25
; JPOG69 R2: degrees per second
rb_turn_speed = 100
; JPOG69 R2 test switch: 1 = RB turns left
rb_turn_invert = 0
; JPOG69 R7: a bite only hits a dino in front of the mouth (no blood / damage on air bites)
bite_front_only = 1
; JPOG69 R4: a player's dino breaks a fence after fence_bites bites (AI dinos unchanged)
fence_break = 1
; JPOG69 R4: metres beyond the dino's own radius
fence_reach = 5
; JPOG69 R4 (owner 17:09): bites on the same fence section that break it (never by walking into it)
fence_bites = 5

[unlocks]
; Always-on progression / easy start (1 = on). Applied automatically in every park. Set to 0 for the normal game.
site_b         = 1      ; Site B button + all missions open
all_research   = 1      ; all research complete (incl. research that becomes available later)
all_dig_sites  = 1      ; every fossil dig-site ground unlocked (Site A and B)
max_stars      = 0      ; 0 = parks START at 5 stars via Data\Constant.ini ParkStartEsat=.96; 1 = also force it to stay at 5
infinite_money = 1      ; money topped back up whenever it drops below money_floor
money_floor    = 1000000
money_topup    = 10000000
; JPOG69 R3: 1 = every species 100% DNA (hatchery lists all), 2 = vanilla Mr DNA, 0 = off
mr_dna = 1

[coop]
; Split-screen. orientation: horizontal (top/bottom) | vertical (left/right)
split_orientation =vertical
; Who has the building HUD/cursor: p1_back = player 1 holds Back (0.6 s) to pass it to player 2 and back
; (the default; tap Back = Research), any_button = the old way (any button on the other pad takes it).
handover = p1_back
; 1 = hide the mouse pointer in console style when 2 controllers are connected / split-screen is on
;     (it comes back in PC-cursor style - right-stick click - and with one controller).
hide_cursor = 1
; JPOG34: how far the world camera can zoom out (x the game's limits: max distance 100, max height 82). 1 = game default.
zoom_out_mult = 1.5
; JPOG34: the player WITHOUT the HUD presses A = control the nearest dinosaur within this many metres of the middle of their view.
pick_radius = 15
; JPOG34: seconds the dino controls hint stays up when a dino is taken (Back / Start while riding shows it again).
rider_hint_secs = 30
; JPOG34: 1 = visitor thought bubbles / unit icons only inside the half that has the HUD (they used to spill over).
icons_active_half = 1
; JPOG34 line-drawn ring: REPLACED in JPOG39 by [controller] aim_circle (key no longer used).
aim_marker = 0
; JPOG36: 0 = draw the HUD player's half FIRST (default: the building placement footprint / hover highlights show for
; the player with the HUD; icons and mouse picking still use that player's view). 1 = JPOG34/35 order (HUD half last).
render_active_last = 0
; JPOG37: 1 = a unit that EITHER half can see keeps the engine's full-rate update (no lagging / teleporting dinos or
; jeep wheels left behind in split-screen). 0 = the game's own culling (the last drawn half decides).
split_cull_fix = 1
; Shared park budget (1) or separate (0).
shared_budget = 1
; 1 = split automatically when a 2nd controller is connected after a park loads (like Turok).
auto_split = 1
; 1 = "Split: Horizontal/Vertical" toggle in the Options popup (needs the main.gui patch).
options_menu_toggle = 1
; Player 2 camera (controller 2): left stick move, right stick look, RT up / LT down, LS or RB = fast.
p2_move_speed = 30
p2_turn_rate = 110
p2_start_offset = 15
p2_invert_yaw = 0
p2_invert_pitch = 0
p2_invert_move = 0
p2_invert_updown = 0
; JPOG49: the player without the HUD presses X = their own copy of the game's build disc (stick = point at a
;   picture, A = pick, B = back, X = close). 0 = the old JPOG46-48 text list instead.
p2_disc_menu = 1
; 1 if pushing the stick UP highlights the BOTTOM picture of player 2's disc.
p2_disc_invert_stick = 0
; JPOG59: player 2's pad inside their own windows (D-pad = highlight a button, A = press it).
p2_window_pad = 1
rb_up_info = 0         ; JPOG63: 0 = RB + D-pad Up controls the selected dino (old way). 1 = it opens the info bar instead
popup_caller_log = 0   ; JPOG62 diagnosis: log every window opened in the 3 s after player 2 opens one (who raises the message popup)
icon_hud_reproj = 1    ; JPOG62: thought bubbles / unit icons in the HUD player's half use the same projection as the other half. 0 = JPOG61 way
p2_fs_keep_park = 1   ; JPOG60: player 2's own full-screen windows (Performance report ...) never hide player 1's park
cull_log_types =                    ; JPOG60 diagnosis (security building pop-in), emptied in JPOG62 . e.g. rangerdp,scamera,camera,shelter = log per-pass culling of these unit types
; JPOG59: player 2's A on a building (no dino at the aim) = that building's own window in player 2's half.
p2_buildings = 1
; JPOG59: 1 = old 'player 1 holds Back = pass the HUD'. 0 = removed (Start = whoever presses it).
back_handover = 0
; JPOG59: the player without the HUD presses Start = the game's Start menu for them; the HUD goes back when it closes.
start_borrow = 1
; JPOG59: split only - max starts of ONE sound sample per second (goat sounds). 0 = off.
sound_limit = 3
; JPOG69 R1: player without the HUD: A on a dino flies their camera to it and follows it
p2_select_fly = 1
; JPOG69 R1: camera distance after the fly-in
p2_select_dist = 30
; JPOG69 R5: player 2 camera stick = player 1 speeds (zoom 2x frame time like the game keys)
p2_cam_match = 1
; JPOG69 R5: stick push that gives full camera speed
p2_stick_full = 0.7
; JPOG69 R5: extra zoom multiplier for player 2
p2_zoom_speed = 1.0

[keys]
; Keyboard fallbacks + mode toggles (always active). Chosen to avoid the game's own keys
; (F1 Objectives, F2 Research, F3 Fossil Hunt, F4 DNA Lab, F5 Market, Q/E rotate).
toggle_player_mode = F9
spawn_menu         = F10
swap_weapon        = X
cycle_view         = V
toggle_coop        = F11   ; force split-screen on/off (no 2nd pad needed)
toggle_split       = F12   ; vertical <-> horizontal (P2 Back does the same)
ride_keys          = 1         ; JPOG63/64: keyboard riding keys for player 1 (0 = off). Keys the game itself doesn't use.
ride_toggle        = T         ; take control of the selected dinosaur / let go (= RB + D-pad Up / B)
ride_forward       = I
ride_back          = K
ride_left          = J         ; strafe left
ride_right         = L         ; strafe right
ride_run           = RSHIFT    ; run on/off (= left-stick click)
ride_bite          = U         ; = RT
ride_finish        = H         ; finishing move (= RB)
ride_pounce        = O         ; pounce / special move (= LT)
ride_roar          = Y         ; tap = call 1, hold = call 2
ride_eat           = N         ; = X
ride_drink         = G         ; = A (at water)
ride_sleep         = Z         ; = LB
ride_cam_left      = NUMPAD4   ; camera (split-screen chase camera; one player: the game's Q E R F keys)
ride_cam_right     = NUMPAD6
ride_cam_up        = NUMPAD8
ride_cam_down      = NUMPAD2
ride_zoom_in       = ADD       ; numpad +
ride_zoom_out      = SUBTRACT  ; numpad -

[debug]
; 1 = read jpogmod_pad.txt in the game folder as a virtual controller (dev testing).
virtual_pad = 0
; Unit name: hold Back + D-pad Right in a park = spawn two test dinos and select one. Empty = off.
test_dino =
; JPOG37: 1 = every 10 s write the frame time (ms, fps), the number of dinosaurs and split on/off to jpogmod.log.
perf_log = 0

[vehicle]
; JPOG59: the pad's sticks drive the helicopter / jeeps / mini games (the console version's stick input); RT fire, LT right button.
pad_sticks = 1
; 1 = flip the stick Y sent to the game (if up/down are reversed in a vehicle).
pad_invert_y = 0
; Player-driven vehicle guns that have no sound in the game get this sound (739 = rifle, 742 = the other gun sound). 0 = off.
gun_sound = 1
gun_sound_id = 739


[display]
; JPOG67 (all off by themselves while JPOGMouseFix.asi is in the game folder):
; 1 = the game does not grab the keyboard: Windows key, Print Screen, Alt+Tab work.
free_keyboard = 1
; 1 = Alt+F4 closes the game.
alt_f4_quit = 1
; 1 = borderless window covering the monitor. Needs ScreenWindowed = true; in Options.ini (fullscreen otherwise).
borderless = 0

[mouse]
; Park / menu cursor speed (1.0 = game default) and 1 = no acceleration (1:1 movement).
cursor_speed = 0.5
no_accel = 1

[camera]
; 1 = park camera speed-up / braking takes the same time at any FPS (as at smoothing_fps).
fix_smoothing = 1
smoothing_fps = 30